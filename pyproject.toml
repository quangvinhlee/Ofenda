[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-ofrenda"
version = "0.1.0"
description = "A Día de los Muertos altar for the dead files, reverts and contributors in your git history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
git-ofrenda = "ofrenda.cli:run"

[tool.setuptools]
packages = ["ofrenda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
